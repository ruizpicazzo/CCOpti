name: Daily Promo Scraper

on:
  schedule:
    - cron: '1 6 * * *'   # 06:01 UTC = 00:01 Mexico City (UTC-6, no DST)
  workflow_dispatch:       # Allow manual trigger from the GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Persist the content-hash cache between runs so unchanged bank pages
      # skip the LLM extraction (saves Anthropic tokens).
      - name: Restore scrape cache
        uses: actions/cache@v4
        with:
          path: backend/scrape_cache.json
          key: scrape-cache-${{ github.run_id }}
          restore-keys: |
            scrape-cache-

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          playwright install chromium firefox
          playwright install-deps chromium firefox

      - name: Run scraper
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m app.scraper
